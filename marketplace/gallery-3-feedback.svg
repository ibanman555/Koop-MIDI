    <g transform="translate(710 340)"><rect width="500" height="390" rx="34" fill="#10263e"/><circle cx="250" cy="115" r="62" fill="#16a34a"/><text x="250" y="134" text-anchor="middle" fill="#fff" font-size="58" font-weight="800">2</text><text x="250" y="235" text-anchor="middle" fill="#fff" font-size="38" font-weight="700">Press the key</text><text x="250" y="295" text-anchor="middle" fill="#aebfd0" font-size="27">Messages send immediately</text></g>
    <g transform="translate(1300 340)"><rect width="500" height="390" rx="34" fill="#10263e"/><circle cx="215" cy="115" r="51" fill="#16a34a"/><path d="M190 115l18 18 34-42" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><circle cx="295" cy="115" r="51" fill="#dc2626"/><path d="M275 95l40 40m0-40l-40 40" stroke="#fff" stroke-width="13" stroke-linecap="round"/><text x="250" y="235" text-anchor="middle" fill="#fff" font-size="38" font-weight="700">Get feedback</text><text x="250" y="295" text-anchor="middle" fill="#aebfd0" font-size="27">Success and error alerts</text></g>
  </g>
  <text x="960" y="835" text-anchor="middle" fill="#7ee787" font-family="Arial, sans-serif" font-size="32" font-weight="700">Works with Bome virtual MIDI ports</text>
