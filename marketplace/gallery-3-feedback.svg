<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="960" viewBox="0 0 1920 960">
  <rect width="1920" height="960" fill="#07111f"/>
  <text x="120" y="155" fill="#fff" font-family="Arial, sans-serif" font-size="68" font-weight="800">Reliable Windows MIDI workflows</text>
  <text x="124" y="225" fill="#9db0c4" font-family="Arial, sans-serif" font-size="34">Choose a physical or virtual output, then see whether the message worked.</text>
  <g font-family="Arial, sans-serif">
